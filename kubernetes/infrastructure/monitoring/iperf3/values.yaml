controllers:
  iperf3:
    containers:
      app:
        env:
          TZ: "Europe/Berlin"
        image:
          repository: networkstatic/iperf3
          tag: latest@sha256:25bce1d02f5e1c0acb4a4376815b87059ad730cd9a1c18ce8a9cb9babd7ad05f
        args:
          - -s
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 64Mi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

service:
  app:
    type: LoadBalancer
    controller: iperf3
    annotations:
      io.cilium/lb-ipam-ips: 192.168.30.31
    ports:
      iperf:
        port: 5201
