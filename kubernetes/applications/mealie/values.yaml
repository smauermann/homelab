# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/library/common/values.schema.json
---
controllers:
  mealie:
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    containers:
      app:
        image:
          repository: ghcr.io/mealie-recipes/mealie
          tag: v3.22.0@sha256:36c28f0642fb6c75fae8997a2d55994631b9b4bcffba3016c208fc132a4c1e69
        env:
          BASE_URL: https://mealie.costanza.cloud
          API_DOCS: false
          OIDC_AUTH_ENABLED: "true"
          OIDC_SIGNUP_ENABLED: "true"
          OIDC_CONFIGURATION_URL: https://pid.costanza.cloud/.well-known/openid-configuration
          OIDC_USER_CLAIM: preferred_username
          OIDC_AUTO_REDIRECT: "false"
          OIDC_PROVIDER_NAME: Pocket ID
          OIDC_GROUPS_CLAIM: groups
          OIDC_ADMIN_GROUP: admins
          OIDC_USER_GROUP: family
        envFrom:
          - secretRef:
              name: mealie-secrets
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 100m
            memory: 400Mi
          limits:
            memory: 600Mi

service:
  app:
    controller: mealie
    ports:
      http:
        port: 9000

route:
  app:
    kind: HTTPRoute
    annotations:
      gethomepage.dev/description: Recipes
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Personal
      gethomepage.dev/icon: mealie.png
      gethomepage.dev/name: Mealie
    parentRefs:
      - name: private
        kind: Gateway
        namespace: envoy-gateway-system
    hostnames:
      - mealie.costanza.cloud

persistence:
  config:
    existingClaim: mealie-data
    globalMounts:
      - path: /app/data
  nltk:
    type: emptyDir
    globalMounts:
      - path: /nltk_data
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
