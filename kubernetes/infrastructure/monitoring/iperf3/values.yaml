controllers:
  iperf3:
    containers:
      app:
        env:
          TZ: "Europe/Berlin"
        image:
          repository: networkstatic/iperf3
          tag: latest@sha256:bc267517f534d9f7cced2669f325799a1fd7fe1d5953c2ca2c6ea1db61affa08
        args:
          - -s
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 64Mi

defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000

service:
  app:
    type: LoadBalancer
    controller: iperf3
    annotations:
      io.cilium/lb-ipam-ips: 192.168.30.31
    ports:
      iperf:
        port: 5201
