apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arr

helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    version: 5.1.0
    namespace: arr
    releaseName: bazarr
    valuesFile: values.yaml
  - name: pvc-backup
    repo: https://smauermann.github.io/helm-charts
    version: 2.3.0
    releaseName: bazarr-backup
    namespace: arr
    valuesInline:
      appName: bazarr
      backup:
        pvcName: bazarr-config
      restore:
        enabled: true
        pvcSize: 5Gi
